services:
  setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: npm install
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: node server.js
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - API_PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: npx vite --host 0.0.0.0 --port 5173
    ports:
      - "3000:5173"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped
